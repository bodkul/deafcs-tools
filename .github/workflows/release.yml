# On a v* tag: builds the Chrome and Firefox zips (plus the Firefox sources zip for AMO review)
# with WXT, optionally signs the Firefox build as an unlisted .xpi, and publishes them as a GitHub Release.
# The tag must match "version" in package.json (v1.2.3 <-> 1.2.3), and the root manifest.json must
# have the same version, otherwise the run fails.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        id: version
        run: |
          version="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Releases up to 1.2.1 look for updates in manifest.json at the repo root on main.
      - name: Check legacy manifest.json version
        run: |
          legacy="$(jq -r .version manifest.json)"
          if [ "$legacy" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::manifest.json version $legacy doesn't match package.json; 1.2.1 and older installs read it to find updates"
            exit 1
          fi

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chrome: deafcs-tools-<version>-chrome.zip
      # Firefox: deafcs-tools-<version>-firefox.zip and deafcs-tools-<version>-sources.zip
      - name: Build zips
        run: |
          pnpm zip
          pnpm zip:firefox
          ls -l .output/*.zip

      # Until the AMO listing is approved, Firefox users install a signed .xpi from the release
      # (csdeaf.com/tools offers the "-firefox.xpi" asset). Mozilla signs unlisted versions
      # automatically, usually within minutes. Only when the repository variable FIREFOX_UNLISTED is
      # "true": AMO takes each version number in one channel only, so a version signed here can never
      # be submitted to the listing. Turn the variable off before releasing a version for the listing.
      # Needs the secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (addons.mozilla.org → Developer Hub →
      # Manage API Keys).
      - name: Sign Firefox .xpi (unlisted)
        if: vars.FIREFOX_UNLISTED == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm dlx web-ext@10.8.0 sign \
            --channel unlisted \
            --source-dir .output/firefox-mv2 \
            --artifacts-dir .output/signed \
            --upload-source-code ".output/deafcs-tools-$VERSION-sources.zip" \
            --approval-timeout 1800000
          mv .output/signed/*.xpi ".output/deafcs-tools-$VERSION-firefox.xpi"
          ls -l .output/*.xpi

      # The Chrome zip goes up first, alone: csdeaf.com/tools offers the release's first .zip asset
      # as the download, so it must not be the Firefox or sources zip.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" ".output/deafcs-tools-$VERSION-chrome.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Installation: https://csdeaf.com/tools"
          gh release upload "$GITHUB_REF_NAME" \
            ".output/deafcs-tools-$VERSION-firefox.zip" \
            ".output/deafcs-tools-$VERSION-sources.zip"
          if [ -f ".output/deafcs-tools-$VERSION-firefox.xpi" ]; then
            gh release upload "$GITHUB_REF_NAME" ".output/deafcs-tools-$VERSION-firefox.xpi"
          fi
