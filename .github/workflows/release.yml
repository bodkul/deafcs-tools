# On a v* tag: builds deafcs-tools-<version>.zip and publishes it as a GitHub Release.
# The tag must match "version" in manifest.json (v1.2.3 <-> 1.2.3), otherwise the run fails.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        id: version
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only the files the extension needs, with manifest.json at the zip root.
      - name: Build zip
        run: |
          zip -r -X "deafcs-tools-${{ steps.version.outputs.version }}.zip" \
            manifest.json background.js shared.js popup.html popup.js content-scripts icons LICENSE
          unzip -l "deafcs-tools-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "deafcs-tools-${{ steps.version.outputs.version }}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Installation: https://csdeaf.com/tools"
